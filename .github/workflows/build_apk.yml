name: Flutter APK Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Fester Ubuntu-Standard für maximale Stabilität

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v3
        with:
          flutter-version: '3.19.0' # Stabile, feste Flutter-Version
          channel: 'stable'
          cache: true

      - name: Dependencies installieren
        run: flutter pub get

      - name: APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk