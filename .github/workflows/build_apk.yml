name: Flutter APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Android Lizenzen und Umgebung prüfen
        run: |
          yes | flutter doctor --android-licenses
          flutter doctor

      - name: Abhängigkeiten laden
        run: flutter pub get

      - name: APK Release bauen
        run: flutter build apk --release